name: publish

# One package per tag: `timeline-v0.1.1`, `token-meter-v0.2.0`, ...

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: resolve package and version from the tag
        id: target
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          pkg="${tag%-v*}"
          version="${tag##*-v}"
          dir="packages/${pkg}"

          if [ ! -f "${dir}/package.json" ]; then
            echo "::error::tag '${tag}' does not point at a package: ${dir}/package.json is missing"
            exit 1
          fi

          name="$(node -p "require('./${dir}/package.json').name")"
          declared="$(node -p "require('./${dir}/package.json').version")"

          if [ "${declared}" != "${version}" ]; then
            echo "::error::tag says ${version} but ${dir}/package.json says ${declared} -- bump the version, commit, then tag"
            exit 1
          fi

          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publishing ${name}@${version} from ${dir}"

      - name: prepare the release notes from both changelogs
        id: notes
        env:
          VERSION: ${{ steps.target.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="${{ steps.target.outputs.dir }}"
          tmp="${RUNNER_TEMP}/changelog"
          mkdir -p "$tmp"

          # The "## <version>" section of one changelog; the heading and the blank line
          # after it are dropped.
          extract() {
            awk -v v="## $2" '
              index($0, v) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' "$1" | sed '/./,$!d'
          }

          # Both changelogs have to carry this version -- the body links to both, and a
          # missing section means the two are out of sync. Checked before npm publish on
          # purpose: the fix is to write the missing section, commit and re-tag, and that
          # stays clean only while the version is still absent from npm.
          for pair in "en:CHANGELOG.md" "zh:CHANGELOG_zh.md"; do
            lang="${pair%%:*}"
            file="${dir}/${pair#*:}"
            if [ ! -f "$file" ]; then
              echo "::error::${file} is missing -- a release needs both changelogs"
              exit 1
            fi
            extract "$file" "$VERSION" > "${tmp}/${lang}"
            if [ ! -s "${tmp}/${lang}" ]; then
              echo "::error::${file} has no '## ${VERSION}' section -- add it, commit, then tag ${TAG} again"
              exit 1
            fi
          done

          # The body opens with a labelled language switch pointing at the full changelogs.
          # GitHub renders the body outside the repository, so the changelog's own relative
          # link would resolve against the release URL and 404 -- write both sides as
          # absolute links pinned to the tag that triggered this run.
          base="https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/${dir}"
          body="${tmp}/body.md"
          printf 'Changelog: [English](%s/CHANGELOG.md) | [简体中文](%s/CHANGELOG_zh.md)\n\n' "$base" "$base" > "$body"
          cat "${tmp}/en" >> "$body"

          echo "body=${body}" >> "$GITHUB_OUTPUT"

      - name: check npm supports trusted publishing
        run: |
          set -euo pipefail
          version="$(npm --version)"
          echo "npm ${version}"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`::error::trusted publishing needs npm >= 11.5.1, this runner has ${process.argv[1]}`);
              process.exit(1);
            }
          ' "$version"

      - name: decide whether to publish
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="${{ steps.target.outputs.name }}"
          version="${{ steps.target.outputs.version }}"
          publish=true

          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            # Already on npm: either this tag is a duplicate, or a previous run
            # published the package but failed before creating its release.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::${name}@${version} is already on npm and ${TAG} already has a release -- nothing to do. Bump the version in ${{ steps.target.outputs.dir }}/package.json, commit, then tag that version; or delete this tag if it was a mistake."
              exit 1
            fi
            echo "::warning::${name}@${version} is already on npm -- publishing is skipped, only the missing GitHub release is created"
            publish=false
          else
            echo "${name}@${version} is not on npm yet -- publishing"
          fi

          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: install pi (the tests drive pi's own loader)
        if: steps.state.outputs.publish == 'true'
        run: |
          set -euo pipefail
          pkg="@earendil-works/pi-coding-agent"

          # Install globally: the harness expects pi-tui nested inside pi-coding-agent,
          # which is how global installs lay out; PI_PACKAGE_DIR points it at that copy.
          # The registry's `latest` has pointed at a version whose tarball 404'd, so walk
          # back from `latest` through the versions published before it until one installs.
          # Read the raw packument rather than `npm view --json`: the JSON shape that
          # command produces differs between npm versions (npm 12 wraps it in an array).
          meta="$(curl -fsSL "https://registry.npmjs.org/${pkg//\//%2f}" | node -e '
            let raw = "";
            process.stdin.on("data", (d) => (raw += d)).on("end", () => {
              const doc = JSON.parse(raw);
              const latest = doc["dist-tags"].latest;
              const times = doc.time ?? {};
              const versions = Object.keys(times).filter((v) => /^\d+\.\d+\.\d+$/.test(v));
              versions.sort((a, b) => Date.parse(times[b]) - Date.parse(times[a]));
              const at = Math.max(versions.indexOf(latest), 0);
              console.log(latest);
              console.log(versions.slice(at, at + 5).join(" "));
            });
          ')"
          latest="$(printf '%s\n' "$meta" | head -n 1)"
          candidates="$(printf '%s\n' "$meta" | tail -n 1)"

          installed=""
          for version in $candidates; do
            if npm install -g --ignore-scripts "$pkg@$version"; then
              installed="$version"
              break
            fi
            echo "::warning::${pkg}@${version} could not be installed -- trying the previous version"
          done

          if [ -z "$installed" ]; then
            echo "::error::none of these ${pkg} versions could be installed: ${candidates}"
            exit 1
          fi
          echo "pi ${installed} installed for this test run (latest is ${latest})"

          echo "PI_PACKAGE_DIR=$(npm root -g)/${pkg}" >> "$GITHUB_ENV"
          # Log which pi the tests will run against (so a red run names the version).
          npm ls -g "$pkg" --depth=0 || true

      - name: test
        if: steps.state.outputs.publish == 'true'
        working-directory: ${{ steps.target.outputs.dir }}
        run: node test/run.mjs

      - name: publish
        if: steps.state.outputs.publish == 'true'
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm publish

      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.target.outputs.version }}
          NAME: ${{ steps.target.outputs.name }}
        run: |
          set -euo pipefail
          # Idempotent: never errors when the release already exists. Also the whole
          # point of the decision step above, which routes a run that already has its
          # package on npm but no release here.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists -- nothing to do"
            exit 0
          fi

          # The body is prepared before publishing: the language switch plus the English
          # "## <version>" section. See the "prepare the release notes" step.
          gh release create "$TAG" --title "${NAME}@${VERSION}" --notes-file "${{ steps.notes.outputs.body }}"
